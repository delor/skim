<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="560" viewBox="0 0 1400 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5674dd"/>
      <stop offset="1" stop-color="#8aabff"/>
    </linearGradient>
    <filter id="winshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0d1017" flood-opacity="0.38"/>
    </filter>
    <clipPath id="miniclip"><rect x="880" y="96" width="430" height="368" rx="10"/></clipPath>
    <g id="skimicon">
      <rect width="24" height="24" rx="5.5" fill="#0d1017" stroke="#2c3344" stroke-width="1"/>
      <rect x="4.5" y="6.2" width="15" height="2.1" rx="1.05" fill="#e8eaf0"/>
      <rect x="4.5" y="10.9" width="10.5" height="2.1" rx="1.05" fill="#7aa2ff"/>
      <rect x="4.5" y="15.6" width="6.4" height="2.1" rx="1.05" fill="#4a5164"/>
      <circle cx="18.4" cy="16.7" r="1.4" fill="#ffd866"/>
    </g>
  </defs>

  <rect width="1400" height="560" fill="url(#bg)"/>

  <!-- Left: brand + message -->
  <g transform="translate(96 118) scale(1.9)"><use xlink:href="#skimicon"/></g>
  <text x="152" y="153" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Skim</text>

  <text x="96" y="248" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="700" fill="#ffffff" letter-spacing="-1">Read what your AI wrote.</text>
  <text x="96" y="318" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="700" fill="#ffd866" letter-spacing="-1">Instantly.</text>

  <text x="96" y="376" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#eef2ff">The free markdown viewer for your browser.</text>

  <g font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" fill="#dbe4ff" text-anchor="middle">
    <rect x="96" y="408" width="144" height="34" rx="17" fill="#0d1017" opacity="0.25"/>
    <text x="168" y="430">live reload</text>
    <rect x="254" y="408" width="170" height="34" rx="17" fill="#0d1017" opacity="0.25"/>
    <text x="339" y="430">math + mermaid</text>
    <rect x="438" y="408" width="108" height="34" rx="17" fill="#0d1017" opacity="0.25"/>
    <text x="492" y="430">quizzes</text>
    <rect x="560" y="408" width="134" height="34" rx="17" fill="#0d1017" opacity="0.25"/>
    <text x="627" y="430">no account</text>
  </g>

  <!-- Right: mini rendered window -->
  <rect x="880" y="96" width="430" height="368" rx="10" fill="#15151a" filter="url(#winshadow)"/>
  <g clip-path="url(#miniclip)">
    <rect x="880" y="96" width="430" height="368" fill="#15151a"/>
    <rect x="880" y="96" width="430" height="38" fill="#0b0e14"/>
    <line x1="880" y1="134" x2="1310" y2="134" stroke="#232838" stroke-width="1"/>
    <g transform="translate(898 103) scale(1.0)"><use xlink:href="#skimicon"/></g>
    <rect x="932" y="104" width="230" height="22" rx="11" fill="#161b26"/>
    <text x="946" y="119" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#9aa3b8">file:///project/plan.md</text>

    <!-- h1 bar -->
    <rect x="912" y="162" width="172" height="28" rx="3" fill="#6b6be4"/>
    <text x="926" y="181" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#f4f2b0">Implementation Plan</text>

    <!-- heading + ghost prose -->
    <text x="912" y="232" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700"><tspan fill="#7e7e86">## </tspan><tspan fill="#4ab8f5">Overview</tspan></text>
    <g fill="#333340">
      <rect x="912" y="248" width="366" height="10" rx="5"/>
      <rect x="912" y="268" width="340" height="10" rx="5"/>
      <rect x="912" y="288" width="356" height="10" rx="5"/>
    </g>

    <!-- task list -->
    <g>
      <rect x="912" y="316" width="13" height="13" rx="3" fill="#4fb886"/>
      <path d="M915 322.5 l2.6 2.6 4.6 -5" stroke="#0d1017" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="936" y="317" width="240" height="10" rx="5" fill="#333340"/>
      <rect x="912" y="340" width="13" height="13" rx="3" fill="#4fb886"/>
      <path d="M915 346.5 l2.6 2.6 4.6 -5" stroke="#0d1017" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="936" y="341" width="290" height="10" rx="5" fill="#333340"/>
      <rect x="912" y="364" width="13" height="13" rx="3" fill="none" stroke="#56565e" stroke-width="1.5"/>
      <rect x="936" y="365" width="210" height="10" rx="5" fill="#333340"/>
    </g>

    <!-- inline code chip -->
    <rect x="912" y="396" width="96" height="10" rx="5" fill="#333340"/>
    <rect x="1018" y="390" width="92" height="21" rx="4" fill="#2c2c34"/>
    <text x="1027" y="405" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#f06b6b">npm run dev</text>
    <rect x="1120" y="396" width="150" height="10" rx="5" fill="#333340"/>

    <g fill="#333340">
      <rect x="912" y="426" width="366" height="10" rx="5"/>
      <rect x="912" y="446" width="330" height="10" rx="5"/>
    </g>
  </g>
</svg>
